train_dataset:
  dataset:
    name: image-folder
    args:
      hr_path: /home/m11215122/datasets/OpenImages/HR_sdxl_latent
      lr_path: /home/m11215122/datasets/OpenImages/LR_sdxl_latent
      scales:
      - 2
      - 3
      - 4
  wrapper:
    name: sr-explicit-paired
    args:
      inp_size: 32
      augment: []
      sample_size: 64
  num_workers: 4
  batch_size: 64
valid_path: /home/m11215122/datasets/OpenImages/HR
sd_ckpt: stabilityai/stable-diffusion-xl-base-1.0
model:
  name: liif
  args:
    feat_unfold: true
    local_ensemble: true
    encoder_spec:
      name: swinir
      args:
        img_size: 32
        in_chans: 4
        embed_dim: 60
        depths:
        - 6
        - 6
        - 6
        - 6
        num_heads:
        - 6
        - 6
        - 6
        - 6
        window_size: 8
        upsampler: none
    imnet_spec:
      name: mlp
      args:
        out_dim: 4
        hidden_list:
        - 256
        - 256
        - 256
        - 256
optimizer:
  name: adam
  args:
    lr: 0.0002
lr_scheduler:
  name: CosineAnnealingLR_Restart
  args:
    T_period:
    - 1000000
    restarts:
    - 1000000
    weights:
    - 1
    eta_min: 1.0e-07
iter_max: 1000000
iter_print: 2000
iter_val: 1000001
iter_save: 200000
seed: null
save_path: save/swinir-liif-latent-sdxl-v3
resume_path: save/swinir-liif-latent-sdxl-v3/iter_last.pth
world_size: 1
