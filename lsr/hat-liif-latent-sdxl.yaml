model:
  name: liif
  args:
    feat_unfold: true
    local_ensemble: true
    encoder_spec:
      name: hat
      args:
        img_size: 32 # inp_size
        in_chans: 4
        embed_dim: 60
        depths: [6,6,6,6]
        num_heads: [6,6,6,6]
        window_size: 8
        mlp_ratio: 2.
        upsampler: none
        resi_connection: 1conv
        compress_ratio: 3
        squeeze_factor: 30
        overlap_ratio: 0.5
    imnet_spec:
      name: mlp
      args:
        out_dim: 4
        hidden_list: [256,256,256,256]
